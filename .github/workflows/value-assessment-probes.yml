name: Research value assessment probes
on:
  pull_request:
    paths:
      - 'research/value-assessment-20261112/**'
      - '.github/workflows/value-assessment-probes.yml'
  push:
    paths:
      - 'research/value-assessment-20261112/**'
      - '.github/workflows/value-assessment-probes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: research/value-assessment-20261112/requirements.txt
      - run: python -m pip install -r research/value-assessment-20261112/requirements.txt
      - run: python -B -m unittest discover -s research/value-assessment-20261112 -p test_check.py
      - run: python -B research/value-assessment-20261112/check.py
